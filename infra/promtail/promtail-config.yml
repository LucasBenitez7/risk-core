server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - ".*-policy-web-.*"
              - ".*-claims-web-.*"
              - ".*-notification-web-.*"
              - ".*-notification-consumer-.*"
              - ".*-notification-celery-.*"
              - ".*-audit-web-.*"
              - ".*-audit-consumer-.*"
              - ".*-gateway-.*"
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: ".*-(policy-web)-.*"
        target_label: service
        replacement: "policy-service"
      - source_labels: [__meta_docker_container_name]
        regex: ".*-(claims-web)-.*"
        target_label: service
        replacement: "claims-service"
      - source_labels: [__meta_docker_container_name]
        regex: ".*-(notification-web|notification-consumer|notification-celery)-.*"
        target_label: service
        replacement: "notification-service"
      - source_labels: [__meta_docker_container_name]
        regex: ".*-(audit-web|audit-consumer)-.*"
        target_label: service
        replacement: "audit-service"
      - source_labels: [__meta_docker_container_name]
        regex: ".*-(gateway)-.*"
        target_label: service
        replacement: "gateway"
      - source_labels: [__meta_docker_container_name]
        regex: ".+"
        target_label: container_name
      - action: labelmap
        regex: __meta_docker_container_label_(com_docker_compose_service)
        replacement: compose_service
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event: event
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z"
      - labels:
          level:
