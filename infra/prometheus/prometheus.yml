global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: policy-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - policy-web:8001
        labels:
          service: policy-service

  - job_name: claims-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - claims-web:8002
        labels:
          service: claims-service

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-web:8003
        labels:
          service: notification-service

  - job_name: audit-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - audit-web:8004
        labels:
          service: audit-service

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
