name: CI — Global Lint

on:
  push:
  pull_request:

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run detect-secrets
        run: |
          pip install detect-secrets==1.5.0
          detect-secrets scan --all-files --baseline .secrets.baseline \
            --exclude-files '\.agents/.*|\.claude/.*|\.cursor/.*|\.windsurf/.*|skills-lock\.json|infra/docker-compose\.yml|.*/tests/.*' \
            .secrets.baseline
