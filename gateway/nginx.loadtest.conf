# Load test override — same as nginx.conf but with elevated rate limits.
# Rate limits: 10000 r/min (166 req/s), sufficient for 1000 concurrent users
# without the rate limiter becoming the throughput ceiling.
# Alternatives considered and rejected:
#   - rate=off: hides bugs in the rate limit chain
#   - rate=100000r/m: indistinguishable from off
# Increase only the limits; all other directives (auth_request, error pages,
# headers, JSON logs, IP whitelist) must be identical to nginx.conf.
limit_req_zone $binary_remote_addr zone=api_anon:10m rate=10000r/m;
limit_req_zone $http_authorization zone=api_auth:10m rate=10000r/m;
limit_req_status 429;

# JSON access logs — parsed by Promtail with pipeline_stages.json
log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"limit_req_status":"$limit_req_status",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id",'
        '"service":"gateway"'
    '}';

upstream policy_service {
    server policy-web:8001;
}

upstream claims_service {
    server claims-web:8002;
}

upstream notification_service {
    server notification-web:8003;
}

upstream audit_service {
    server audit-web:8004;
}

server {
    listen 80;

    # Override http-level access_log with JSON format for Promtail/Loki
    access_log /var/log/nginx/access.log json_combined;

    # Global proxy headers — propagated to all upstreams
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    # Upstream timeouts
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;

    # Security response headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Request-ID $request_id always;

    # Custom error pages — JSON format
    error_page 401 /errors/401;
    error_page 429 /errors/429;
    error_page 502 /errors/502;
    error_page 503 /errors/503;

    # JWT auth subrequest — called by auth_request directive
    # proxy_pass_request_body off: auth subrequests must not forward the original body
    location = /auth/verify {
        internal;
        proxy_pass http://policy_service/api/auth/verify/;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Error response bodies — internal redirects from error_page
    location = /errors/401 {
        internal;
        default_type application/json;
        return 401 '{"error":{"code":"UNAUTHORIZED","message":"Credenciales invalidas o ausentes. Incluya un JWT valido en el header Authorization: Bearer <token>.","details":{}},"request_id":"$request_id"}';
    }

    location = /errors/429 {
        internal;
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"RATE_LIMIT_EXCEEDED","message":"Demasiadas peticiones. Intente nuevamente en unos segundos.","details":{}},"request_id":"$request_id"}';
    }

    location = /errors/502 {
        internal;
        default_type application/json;
        return 502 '{"error":{"code":"BAD_GATEWAY","message":"El servicio no esta disponible en este momento.","details":{}},"request_id":"$request_id"}';
    }

    location = /errors/503 {
        internal;
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"El servicio no esta disponible en este momento.","details":{}},"request_id":"$request_id"}';
    }

    # Gateway health — no auth, no rate limit
    location = /health/ {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Auth endpoints — rate limit by IP, no JWT required (login/refresh)
    location /api/auth/ {
        limit_req zone=api_anon burst=500 nodelay;
        proxy_pass http://policy_service/api/auth/;
    }

    # API routes — JWT required + rate limit by token
    location /api/policies/ {
        auth_request /auth/verify;
        limit_req zone=api_auth burst=500 nodelay;
        proxy_pass http://policy_service/api/policies/;
    }

    location /api/claims/ {
        auth_request /auth/verify;
        limit_req zone=api_auth burst=500 nodelay;
        proxy_pass http://claims_service/api/claims/;
    }

    location /api/notifications/ {
        auth_request /auth/verify;
        limit_req zone=api_auth burst=500 nodelay;
        proxy_pass http://notification_service/api/notifications/;
    }

    location /api/audit/ {
        auth_request /auth/verify;
        limit_req zone=api_auth burst=500 nodelay;
        proxy_pass http://audit_service/api/audit/;
    }

    # /metrics — internal network only (Prometheus scrape)
    location /metrics/policy/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://policy_service/metrics;
    }

    location /metrics/claims/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://claims_service/metrics;
    }

    location /metrics/notifications/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://notification_service/metrics;
    }

    location /metrics/audit/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://audit_service/metrics;
    }

    # Per-service health — no auth, no rate limit
    location /health/policy/ {
        proxy_pass http://policy_service/health/;
    }

    location /health/claims/ {
        proxy_pass http://claims_service/health/;
    }

    location /health/notifications/ {
        proxy_pass http://notification_service/health/;
    }

    location /health/audit/ {
        proxy_pass http://audit_service/health/;
    }
}